<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="rOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE780"/><stop offset="0.35" stop-color="#FFC61F"/><stop offset="1" stop-color="#F29A0E"/>
    </linearGradient>
    <linearGradient id="rRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A80"/><stop offset="0.5" stop-color="#F0383C"/><stop offset="1" stop-color="#B81E28"/>
    </linearGradient>
    <linearGradient id="rBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CD0FF"/><stop offset="0.45" stop-color="#22A0F0"/><stop offset="1" stop-color="#1270C8"/>
    </linearGradient>
    <linearGradient id="rSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.4" stop-color="#FFF1E4"/><stop offset="1" stop-color="#F6D7C6"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- ống tên đỏ sau lưng -->
    <path d="M30 140 L22 116 M42 136 L40 110" fill="none" stroke="#C26A00" stroke-width="10"/>
    <path d="M30 140 L22 116 M42 136 L40 110" fill="none" stroke="#FFC61F" stroke-width="5"/>
    <rect x="22" y="140" width="30" height="80" rx="10" fill="url(#rRed)" stroke="#7E1018" stroke-width="6" transform="rotate(-18 37 180)"/>
    <!-- chân -->
    <rect x="58" y="248" width="30" height="46" rx="10" fill="url(#rBlue)" stroke="#0B4C94" stroke-width="6"/>
    <rect x="100" y="248" width="30" height="46" rx="10" fill="url(#rBlue)" stroke="#0B4C94" stroke-width="6"/>
    <!-- thân áo cam vàng -->
    <rect x="50" y="158" width="90" height="100" rx="24" fill="url(#rOrange)" stroke="#C26A00" stroke-width="6"/>
    <ellipse cx="78" cy="174" rx="18" ry="6" fill="#FFFFFF" opacity="0.6"/>
    <rect x="52" y="212" width="86" height="12" fill="url(#rBlue)" stroke="#0B4C94" stroke-width="4"/>
    <!-- mũ trùm nhọn -->
    <path d="M56 64 L92 5 L114 54 Z" fill="url(#rOrange)" stroke="#C26A00" stroke-width="6"/>
    <circle cx="94" cy="104" r="58" fill="url(#rOrange)" stroke="#C26A00" stroke-width="6"/>
    <ellipse cx="70" cy="66" rx="18" ry="8" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 70 66)"/>
    <!-- mặt -->
    <circle cx="106" cy="112" r="40" fill="url(#rSkin)" stroke="#E0A27A" stroke-width="5"/>
    <ellipse cx="124" cy="108" rx="9" ry="11" fill="#FFFFFF" stroke="#3B1E4F" stroke-width="3"/>
    <circle cx="127" cy="110" r="5.5" fill="#3B1E4F"/>
    <circle cx="129" cy="107" r="2.5" fill="#FFFFFF"/>
    <path d="M106 132 Q116 137 126 132" fill="none" stroke="#3B1E4F" stroke-width="4"/>
    <!-- cung lớn đỏ phía trước -->
    <path d="M150 108 L150 272" fill="none" stroke="#FFF1E4" stroke-width="4"/>
    <path d="M150 108 C206 148 206 232 150 272" fill="none" stroke="#7E1018" stroke-width="16"/>
    <path d="M150 108 C206 148 206 232 150 272" fill="none" stroke="#F0383C" stroke-width="9"/>
    <!-- mũi tên -->
    <path d="M128 190 L184 190" fill="none" stroke="#C26A00" stroke-width="6"/>
    <path d="M196 190 L180 178 L180 202 Z" fill="url(#rBlue)" stroke="#0B4C94" stroke-width="4"/>
    <circle cx="142" cy="192" r="14" fill="url(#rSkin)" stroke="#E0A27A" stroke-width="5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE780"/>
      <stop offset="0.35" stop-color="#FFC61F"/>
      <stop offset="1" stop-color="#F29A0E"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FFF1E4"/>
      <stop offset="1" stop-color="#F6D7C6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CD0FF"/>
      <stop offset="1" stop-color="#22A0F0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CD0FF"/>
      <stop offset="0.4" stop-color="#22A0F0"/>
      <stop offset="1" stop-color="#1270C8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A80"/>
      <stop offset="0.4" stop-color="#F0383C"/>
      <stop offset="1" stop-color="#B81E28"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C77BEA"/>
      <stop offset="0.4" stop-color="#9B30C8"/>
      <stop offset="1" stop-color="#6E1E99"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9ACB"/>
      <stop offset="0.4" stop-color="#F24FA0"/>
      <stop offset="1" stop-color="#C42A78"/>
    </linearGradient>
  </defs>
  <!-- the hero Colorful: bong do lech xuong 8 px, khung vang bong keo vien #C26A00, than kem, o chan dung troi xanh, hero chibi, dai ten tim, huy hieu vai tro hong -->
  <rect x="7" y="14" width="286" height="380" rx="34" fill="#C26A00" fill-opacity="0.55"/>
  <rect x="7" y="6" width="286" height="380" rx="34" fill="url(#gold)" stroke="#C26A00" stroke-width="6"/>
  <path d="M30 18 L270 18 Q282 18 282 30 L282 36 L18 36 L18 30 Q18 18 30 18 Z" fill="#FFE780" fill-opacity="0.8"/>
  <rect x="22" y="22" width="256" height="348" rx="24" fill="url(#cream)" stroke="#E0A27A" stroke-width="4"/>
  <!-- o chan dung -->
  <rect x="34" y="34" width="232" height="206" rx="20" fill="url(#sky)" stroke="#0B4C94" stroke-width="5"/>
  <path d="M48 44 L252 44 Q258 44 258 52 L258 58 L42 58 L42 52 Q42 44 48 44 Z" fill="#FFFFFF" fill-opacity="0.45"/>
  <!-- hero chibi: than do, dau kem, mu xanh -->
  <path d="M96 238 Q98 172 150 168 Q202 172 204 238 Z" fill="url(#red)" stroke="#7E1018" stroke-width="5"/>
  <circle cx="150" cy="122" r="50" fill="url(#cream)" stroke="#E0A27A" stroke-width="5"/>
  <path d="M100 118 Q102 66 150 64 Q198 66 200 118 Q176 98 150 98 Q124 98 100 118 Z" fill="url(#blue)" stroke="#0B4C94" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="128" cy="78" rx="14" ry="7" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="132" cy="130" r="8" fill="#3B1E4F"/>
  <circle cx="168" cy="130" r="8" fill="#3B1E4F"/>
  <circle cx="135" cy="127" r="3" fill="#FFFFFF"/>
  <circle cx="171" cy="127" r="3" fill="#FFFFFF"/>
  <path d="M140 150 Q150 158 160 150" fill="none" stroke="#3B1E4F" stroke-width="4" stroke-linecap="round"/>
  <!-- dai ten tim (chu do game in) -->
  <rect x="34" y="254" width="232" height="60" rx="30" fill="url(#purple)" stroke="#4A1070" stroke-width="5"/>
  <rect x="54" y="260" width="192" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.35"/>
  <!-- huy hieu vai tro -->
  <circle cx="150" cy="340" r="22" fill="url(#pink)" stroke="#8E1556" stroke-width="5"/>
  <path d="M150 326 L155 336 L166 337 L158 344 L160 355 L150 349 L140 355 L142 344 L134 337 L145 336 Z" fill="#FFE780" stroke="#C26A00" stroke-width="3" stroke-linejoin="round"/>
</svg>

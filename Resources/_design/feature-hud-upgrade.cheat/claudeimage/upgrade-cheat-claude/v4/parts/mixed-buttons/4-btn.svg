<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <!-- nut nang cap (mua = nut chinh xanh la): keo phong, gradient doc cung sac, vien #1D6B0C 5 px, bong do lech xuong 7 px, bo lon -->
  <defs>
    <linearGradient id="btnBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BEA5C"/>
      <stop offset="0.45" stop-color="#4CC21E"/>
      <stop offset="1" stop-color="#2E9414"/>
    </linearGradient>
    <linearGradient id="btnGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect x="3" y="10" width="194" height="127" rx="36" fill="#1D6B0C"/>
  <rect x="3" y="3" width="194" height="127" rx="36" fill="url(#btnBody)" stroke="#1D6B0C" stroke-width="5"/>
  <rect x="9" y="104" width="182" height="18" rx="9" fill="#2E9414" opacity="0.6"/>
  <rect x="18" y="10" width="164" height="34" rx="17" fill="url(#btnGloss)"/>
  <circle cx="28" cy="27" r="6" fill="#FFFFFF"/>
</svg>

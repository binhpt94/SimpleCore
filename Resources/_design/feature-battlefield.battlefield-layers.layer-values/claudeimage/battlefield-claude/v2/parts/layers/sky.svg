<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="1920" height="640">
  <!-- troi Colorful: xanh tuoi dam tren, nhat dan xuong chan troi; ghep ngang lien (hai mep khong co vat) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB0F2"/>
      <stop offset="0.6" stop-color="#86D2FA"/>
      <stop offset="1" stop-color="#CFF0FF"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#F4FBFF"/>
      <stop offset="1" stop-color="#CBE7FA"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="640" fill="url(#sky)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <!-- chan dung Hiep si: nen o mau dac, hiep si mu sat, khien xanh, kiem; vien den 4-5 px, bong cung lech xuong 6 px -->

  <path d="M6 150 L234 150 L234 180 Q234 194 220 194 L20 194 Q6 194 6 180 Z" fill="#5BA0C8"/>
  <rect x="4" y="4" width="232" height="192" rx="16" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- kiem (sau nguoi) -->
  <g transform="translate(0 6)" fill="#000000">
    <rect x="160" y="30" width="16" height="96" rx="4"/>
  </g>
  <rect x="160" y="30" width="16" height="96" rx="4" fill="#E8EEF5" stroke="#000000" stroke-width="4"/>
  <rect x="146" y="118" width="44" height="12" rx="4" fill="#C98A00" stroke="#000000" stroke-width="4"/>
  <rect x="161" y="130" width="14" height="22" rx="3" fill="#8B5A2B" stroke="#000000" stroke-width="4"/>
  <!-- than giap -->
  <g transform="translate(0 6)" fill="#000000">
    <path d="M70 196 L76 128 Q120 110 164 128 L170 196 Z"/>
    <rect x="84" y="36" width="72" height="80" rx="30"/>
  </g>
  <path d="M70 196 L76 128 Q120 110 164 128 L170 196 Z" fill="#A9B4C2" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- mu sat -->
  <rect x="84" y="36" width="72" height="80" rx="30" fill="#C9D2DC" stroke="#000000" stroke-width="5"/>
  <rect x="94" y="68" width="52" height="12" rx="5" fill="#1E2430" stroke="#000000" stroke-width="3"/>
  <rect x="116" y="80" width="8" height="28" rx="3" fill="#1E2430"/>
  <path d="M112 36 Q120 10 132 18 Q126 26 128 36 Z" fill="#D8383A" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- khien (truoc nguoi) -->
  <g transform="translate(0 6)" fill="#000000">
    <path d="M40 104 L108 104 L108 140 Q108 176 74 192 Q40 176 40 140 Z"/>
  </g>
  <path d="M40 104 L108 104 L108 140 Q108 176 74 192 Q40 176 40 140 Z" fill="#2F6FD6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

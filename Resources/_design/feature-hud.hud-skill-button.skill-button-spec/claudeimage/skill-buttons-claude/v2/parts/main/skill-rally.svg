<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE780"/>
      <stop offset="0.5" stop-color="#FFC61F"/>
      <stop offset="1" stop-color="#F29A0E"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFF1E4"/>
      <stop offset="1" stop-color="#F6D7C6"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9ACB"/>
      <stop offset="1" stop-color="#F24FA0"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A80"/>
      <stop offset="1" stop-color="#F0383C"/>
    </linearGradient>
    <clipPath id="inner">
      <rect x="11" y="11" width="118" height="110" rx="30"/>
    </clipPath>
  </defs>
  <!-- khung chung: bong do lech xuong 6 px, khung vang vien #C26A00 6 px, bo 38 -->
  <rect x="3" y="9" width="134" height="128" rx="38" fill="#4A1070"/>
  <rect x="3" y="3" width="134" height="126" rx="38" fill="url(#frame)" stroke="#C26A00" stroke-width="6"/>
  <g clip-path="url(#inner)">
    <rect x="11" y="11" width="118" height="110" fill="url(#cream)"/>
    <rect x="11" y="98" width="118" height="23" fill="url(#strip)"/>
  </g>
  <rect x="11" y="11" width="118" height="110" rx="30" fill="none" stroke="#E0A27A" stroke-width="3"/>
  <rect x="34" y="15" width="72" height="6" rx="3" fill="#FFFFFF"/>
  <!-- bieu tuong co co vu do o nua tren -->
  <rect x="50" y="12" width="8" height="46" rx="4" fill="#FFE780" stroke="#C26A00" stroke-width="3"/>
  <path d="M58,15 Q72,10 92,20 Q80,26 90,36 Q74,42 58,38 Z" fill="url(#flag)" stroke="#7E1018" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="54" cy="12" r="5" fill="#FFC61F" stroke="#C26A00" stroke-width="3"/>
</svg>

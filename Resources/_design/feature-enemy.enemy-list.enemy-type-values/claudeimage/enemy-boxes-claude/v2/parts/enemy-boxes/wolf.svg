<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="bl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22A0F0"/><stop offset="0.5" stop-color="#1270C8"/><stop offset="1" stop-color="#1270C8"/>
    </linearGradient>
    <linearGradient id="cr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6D7C6"/>
    </linearGradient>
  </defs>
  <g stroke="#0B4C94" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- đuôi xù -->
    <path d="M62 110 Q20 100 8 60 Q30 72 40 66 Q34 86 70 96 Z" fill="url(#bl)"/>
    <!-- chân sau -->
    <rect x="58" y="138" width="30" height="58" rx="12" fill="#1270C8"/>
    <rect x="168" y="138" width="30" height="58" rx="12" fill="#1270C8"/>
    <!-- thân lưng gù -->
    <path d="M50 120 Q56 66 130 70 Q200 72 214 112 Q214 160 160 162 L90 162 Q50 160 50 120 Z" fill="url(#bl)"/>
    <!-- chân trước -->
    <rect x="94" y="140" width="30" height="56" rx="12" fill="url(#bl)"/>
    <rect x="200" y="140" width="30" height="56" rx="12" fill="url(#bl)"/>
    <!-- tai lớn -->
    <path d="M186 50 L182 6 L218 36 Z" fill="url(#bl)"/>
    <path d="M232 40 L250 4 L262 46 Z" fill="url(#bl)"/>
    <!-- đầu chibi -->
    <circle cx="228" cy="86" r="52" fill="url(#bl)"/>
    <ellipse cx="208" cy="50" rx="20" ry="8" fill="#FFFFFF" opacity="0.6" stroke="none"/>
    <!-- mõm -->
    <path d="M250 96 Q292 92 292 114 Q290 134 250 132 Z" fill="url(#bl)"/>
    <ellipse cx="288" cy="104" rx="8" ry="7" fill="#3B1E4F" stroke="none"/>
    <!-- nanh -->
    <path d="M262 130 L268 146 L274 130 Z" fill="url(#cr)" stroke-width="4"/>
    <path d="M278 130 L283 142 L288 129 Z" fill="url(#cr)" stroke-width="4"/>
    <!-- mắt to, mày giận -->
    <ellipse cx="242" cy="82" rx="15" ry="17" fill="#FFFFFF" stroke-width="5"/>
    <circle cx="248" cy="84" r="8" fill="#3B1E4F" stroke="none"/>
    <circle cx="251" cy="80" r="3.5" fill="#FFFFFF" stroke="none"/>
    <path d="M226 64 L258 72" fill="none" stroke-width="7"/>
    <!-- vệt bóng trên lưng -->
    <ellipse cx="118" cy="84" rx="30" ry="8" fill="#FFFFFF" opacity="0.55" stroke="none"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300" width="250" height="300">
  <defs>
    <linearGradient id="pu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C77BEA"/><stop offset="0.45" stop-color="#9B30C8"/><stop offset="1" stop-color="#6E1E99"/>
    </linearGradient>
    <linearGradient id="ye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE780"/><stop offset="0.5" stop-color="#FFC61F"/><stop offset="1" stop-color="#F29A0E"/>
    </linearGradient>
    <linearGradient id="cr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6D7C6"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round" stroke-width="7">
    <!-- kiếm sau lưng -->
    <rect x="30" y="66" width="22" height="122" rx="10" fill="url(#cr)" stroke="#E0A27A" transform="rotate(12 41 188)"/>
    <rect x="14" y="178" width="58" height="18" rx="9" fill="url(#ye)" stroke="#C26A00"/>
    <!-- chân -->
    <rect x="80" y="258" width="38" height="38" rx="14" fill="#6E1E99" stroke="#4A1070"/>
    <rect x="132" y="258" width="38" height="38" rx="14" fill="#6E1E99" stroke="#4A1070"/>
    <!-- thân khom về trước -->
    <path d="M66 190 Q70 160 120 158 Q176 160 184 200 L182 252 Q178 272 150 272 L96 272 Q66 272 64 250 Z" fill="url(#pu)" stroke="#4A1070"/>
    <rect x="66" y="226" width="116" height="16" rx="6" fill="url(#ye)" stroke="#C26A00" stroke-width="5"/>
    <!-- tai nhọn -->
    <path d="M56 104 L14 76 L58 140 Z" fill="url(#pu)" stroke="#4A1070"/>
    <!-- đầu -->
    <circle cx="118" cy="122" r="70" fill="url(#pu)" stroke="#4A1070"/>
    <!-- sừng -->
    <path d="M66 74 Q30 46 40 8 Q62 40 90 56 Z" fill="url(#cr)" stroke="#E0A27A"/>
    <path d="M168 72 Q204 46 196 8 Q172 40 146 56 Z" fill="url(#cr)" stroke="#E0A27A"/>
    <!-- mũ sắt vàng -->
    <path d="M48 116 A70 70 0 0 1 188 116 L196 128 L40 128 Z" fill="url(#ye)" stroke="#C26A00"/>
    <ellipse cx="96" cy="78" rx="24" ry="9" fill="#FFFFFF" opacity="0.6" stroke="none"/>
    <!-- mắt to, mày giận -->
    <ellipse cx="152" cy="154" rx="19" ry="21" fill="#FFFFFF" stroke="#4A1070" stroke-width="5"/>
    <circle cx="159" cy="157" r="10" fill="#3B1E4F" stroke="none"/>
    <circle cx="163" cy="152" r="4" fill="#FFFFFF" stroke="none"/>
    <path d="M132 136 L172 142" fill="none" stroke="#4A1070" stroke-width="7"/>
    <!-- miệng, nanh -->
    <path d="M136 186 Q158 194 180 182" fill="none" stroke="#4A1070" stroke-width="6"/>
    <path d="M164 188 L170 202 L176 186 Z" fill="#FFFFFF" stroke="#4A1070" stroke-width="4"/>
    <!-- khiên tròn phía trước -->
    <circle cx="196" cy="216" r="44" fill="url(#ye)" stroke="#C26A00"/>
    <circle cx="196" cy="216" r="22" fill="url(#pu)" stroke="#4A1070" stroke-width="5"/>
    <ellipse cx="184" cy="186" rx="16" ry="6" fill="#FFFFFF" opacity="0.6" stroke="none"/>
  </g>
</svg>

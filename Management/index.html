<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreSimple — Quản lý</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1c1a; --muted: #6b6860;
    --line: #dedbd2; --accent: #2f6f5e; --warn-bg: #fbf1d8; --warn-text: #6b4e00;
    --bad: #a3352b; --ok: #2f6f5e;
    --claude: #2a5db0; --gpt: #7a3fa8; --clash: #b85c00; --user: #1f7a3a;   /* chữ của ý chưa chốt: Claude, GPT, hai ý trái nhau, ý của người */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --text: #ecebe6; --muted: #9c998f;
      --line: #33322d; --accent: #7fc4ae; --warn-bg: #3a2f10; --warn-text: #f0d68a;
      --bad: #f08a7e; --ok: #7fc4ae;
      --claude: #8fb4f5; --gpt: #cda4f4; --clash: #f5a04a; --user: #7fd69a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Segoe UI", system-ui, sans-serif;
  }
  .top {
    display: flex; align-items: center; gap: 32px; height: 56px; padding: 0 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2;
  }
  .brand { flex: none; }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.2; }
  .brand strong { display: block; font-size: 15px; line-height: 1.3; }
  #topnav { display: flex; gap: 4px; align-self: stretch; overflow-x: auto; min-width: 0; }
  #topnav a {
    display: flex; align-items: center; padding: 0 14px; color: var(--muted); text-decoration: none;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  #topnav a:hover { color: var(--text); }
  #topnav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  #topnav a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  main { padding: 32px 40px 64px; min-width: 0; }
  h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.25; text-wrap: balance; }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
  h3 { margin: 0; font-size: 15px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
  .cols > section { margin-bottom: 0; }
  p { margin: 0; }
  ul, ol { margin: 0; padding-left: 20px; }
  h3 + table, h3 + ol, h3 + p { margin-top: 6px; }
  .block + .block { margin-top: 16px; }
  details summary { cursor: pointer; }
  details[open] summary { margin-bottom: 8px; }
  td { vertical-align: top; }
  li + li { margin-top: 4px; }
  .muted { color: var(--muted); }
  .notice { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  code { font-family: Consolas, monospace; font-size: .92em; }
  [hidden] { display: none !important; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  main a { color: var(--accent); }
  .bad-text { color: var(--bad); font-weight: 600; }
  .ok-text { color: var(--ok); }
  .doc { white-space: pre-wrap; font: 14px/1.6 Consolas, monospace; margin: 0; overflow-x: auto; }
  .layer + .layer { margin-top: 12px; }
  .layer ul { font: 14px/1.6 Consolas, monospace; }
  .viol { border-left: 3px solid var(--bad); padding: 6px 12px; }
  .viol.ex { border-left-color: var(--line); }
  .viol + .viol { margin-top: 8px; }
  .viol code { display: block; color: var(--muted); word-break: break-all; }
  .session { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
  .session .muted { font-size: 14px; }
  .cmd { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; }
  .cmd pre {
    flex: 1; min-width: 0; margin: 0; padding: 10px 12px; overflow-x: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    font: 14px/1.5 Consolas, monospace; white-space: pre;
  }
  .cmd.tall { flex-direction: column; }
  .cmd.tall pre { white-space: pre-wrap; }
  .cmd.tall button { align-self: flex-start; }
  button.copy {
    flex: none; padding: 8px 14px; border: 1px solid var(--accent); border-radius: 6px;
    background: transparent; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer;
  }
  button.copy:hover { background: var(--accent); color: var(--panel); }
  button.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.copy.danger { border-color: var(--bad); color: var(--bad); }
  button.copy.danger:hover:not(:disabled) { background: var(--bad); color: var(--panel); }
  button.copy.danger:focus-visible { outline-color: var(--bad); }
  /* Nút Live bật/tắt: nền đặc xanh = đang chạy nền; viền xanh = mở ở VS Code (chỉ hiện); viền xám = không live */
  button.copy.live { padding: 4px 10px; font-size: 13px; white-space: nowrap; }
  button.copy.live.on { background: var(--ok); border-color: var(--ok); color: var(--panel); }
  button.copy.live.on:hover:not(:disabled) { background: transparent; color: var(--ok); }
  button.copy.live.vscode, button.copy.live.vscode:disabled, button.copy.live.vscode:hover { border-color: var(--ok); color: var(--ok); background: transparent; opacity: 1; cursor: default; }
  button.copy.live.off { border-color: var(--line); color: var(--muted); }
  button.copy.live.off:hover:not(:disabled) { border-color: var(--ok); background: transparent; color: var(--ok); }
  .gap { margin-top: 16px; }
  footer { margin-top: 24px; font-size: 13px; color: var(--muted); }

  @media (max-width: 700px) {
    .top { padding: 0 16px; gap: 0; }
    .brand { display: none; }
    main { padding: 20px 16px 48px; }
    .cols { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="eyebrow">CoreSimple</div><strong>Trang quản lý</strong></div>
  <nav id="topnav" aria-label="Tab chung"></nav>
</header>
<div class="app">
  <main id="main">
    <div id="notice" class="notice" hidden></div>
    <div id="panes"></div>
    <footer id="footer"></footer>
  </main>
</div>

<!-- Trang này chỉ là vỏ. Mọi nội dung nằm trong data/. Dữ liệu lớn (project, gamedesign, art) không nạp ở đây:
     tab nào cần thì tab đó nạp khi được mở lần đầu (hàm load bên dưới). -->
<script src="data/idea.js"></script>
<script src="data/sessions.js"></script>
<!-- Mỗi tab lớn một file trong view/, đăng ký vào window.CORESIMPLE_VIEWS. -->
<script src="view/gamedesign.js"></script>
<script src="view/studio.js"></script>
<script src="view/references.js"></script>
<script src="view/inbox.js"></script>
<script src="view/activity.js"></script>
<script src="view/bugs.js"></script>
<script>
(function () {
  var idea = window.CORESIMPLE_IDEA || null;
  var sessions = window.CORESIMPLE_SESSIONS || null;
  var project = null;      // có sau load("project")
  var setupInfo = window.CORESIMPLE_SETUP || null;
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  };
  // add(parent, ...children) trả về parent; put(parent, child) trả về child.
  var add = function (parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  };
  var put = function (parent, child) { parent.appendChild(child); return child; };
  var notices = [];

  var copyText = function (text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    // Trang mở từ file:// có thể không có Clipboard API: chép qua một ô nhập tạm.
    return new Promise(function (resolve, reject) {
      var box = el("textarea");
      box.value = text;
      box.style.position = "fixed";
      box.style.opacity = "0";
      document.body.appendChild(box);
      box.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(box);
      if (ok) resolve(); else reject(new Error("copy failed"));
    });
  };

  // `copy` là chữ được chép, mặc định giống chữ hiển thị.
  var commandBlock = function (text, tall, copy) {
    var wrap = el("div", tall ? "cmd tall" : "cmd");
    var pre = el("pre", "", text);
    var button = el("button", "copy", "Chép");
    button.type = "button";
    button.addEventListener("click", function () {
      copyText(copy === undefined ? text : copy).then(
        function () { button.textContent = "Đã chép"; },
        function () { button.textContent = "Không chép được, hãy bôi đen và Ctrl+C"; }
      ).then(function () {
        setTimeout(function () { button.textContent = "Chép"; }, 2000);
      });
    });
    return add(wrap, pre, button);
  };

  var section = function (title) {
    var s = el("section");
    if (title) s.appendChild(el("h2", "", title));
    return s;
  };

  // ---------------------------------------------------------------- tabs
  // needs: các bộ dữ liệu tab cần (khoá của KINDS); tab chỉ được dựng sau khi chúng nạp xong.
  var tabs = [], adding = tabs;   // {key, label, build, needs}
  var tab = function (key, label, build, needs) {
    adding.push({ key: key, label: label, build: build, needs: needs || [] });
  };

  // Dữ liệu lớn, mỗi bộ nạp một lần khi có tab cần tới. Mở qua setup_server.py: server dựng mới đúng bộ đó.
  // Mở thẳng từ file: đọc file trong data/ (Stop hook sinh lại sau mỗi lượt chat); thiếu file thì trả null.
  var KINDS = { project: "CORESIMPLE_PROJECT", gamedesign: "CORESIMPLE_GAMEDESIGN", art: "CORESIMPLE_ART",
                references: "CORESIMPLE_REFERENCES" };
  var loads = {};
  var load = function (kind) {
    if (loads[kind]) return loads[kind];
    var name = KINDS[kind];
    var p = setupInfo ? fetch("/api/" + kind, { headers: { "X-Setup-Token": setupInfo.token }, cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }) : new Promise(function (resolve) {
      var tag = document.createElement("script");
      tag.src = "data/" + kind + ".js";
      tag.onload = function () { resolve(window[name] || null); };
      tag.onerror = function () { resolve(null); };
      document.head.appendChild(tag);
    });
    p = p.then(function (data) {
      window[name] = data;
      if (kind === "project") gotProject(data);
      return data;
    });
    loads[kind] = p;
    p.then(null, function () { delete loads[kind]; });      // lỗi thì lần sau thử lại
    return p;
  };

  // ---------------------------------------------------------------- bảng
  var row = function (cells) {
    var tr = el("tr");
    cells.forEach(function (c) { add(tr, typeof c === "string" ? el("td", "", c) : add(el("td"), c)); });
    return tr;
  };
  var headRow = function (names) {
    return add(el("thead"), add.apply(null, [el("tr")].concat(names.map(function (n) { return el("th", "", n); }))));
  };

  // Tab sinh ra từ dữ liệu project (Báo cáo): đăng ký khi project nạp xong.
  var projectTabs = function () {

  // ---------------------------------------------------------------- báo cáo cho @Manager
  if (project && project.reports) {
    tab("bao-cao", "Báo cáo", function (pane) {
      add(pane, el("h1", "", "Báo cáo cho @CodeLead và @Manager"));
      add(pane, el("p", "sub", "Nhóm Basic, Features, Services kết thúc mỗi lượt có sửa file bằng một báo cáo; Stop hook lưu vào " +
        "Management/reports, @CodeLead (kiểm code) và @Manager (điều phối) đều thấy. Mới nhất trước, tối đa 50."));
      // Việc công cụ người đã quyết (toolwork.py): thay cho Management/proposals. Chỉ để xem; phiên @human làm và đóng.
      var tw = project.toolwork || [];
      var ts = put(pane, section("Việc công cụ người đã quyết (" + tw.filter(function (x) { return x.state === "open"; }).length + " chờ làm)"));
      add(ts, el("p", "muted", "Leader hỏi bạn trong chat; việc bạn đã quyết mà phải sửa công cụ, guard hay luật thì nằm ở đây cho phiên @human làm. " +
        "Xem bằng lệnh: python Management/tools/toolwork.py list --all"));
      if (!tw.length) add(ts, el("p", "muted", "Chưa có việc nào."));
      else {
        var tt = put(ts, el("table"));
        add(tt, headRow(["Mã", "Lúc ghi", "Từ", "Trạng thái", "Việc", "Bạn đã quyết", "Kết quả"]));
        var tb = put(tt, el("tbody"));
        tw.forEach(function (x) {
          var tr = put(tb, el("tr"));
          add(tr, el("td", "", x.id), el("td", "", x.created), el("td", "", x.source),
            el("td", x.state === "open" ? "bad-text" : "muted", x.stateName), el("td", "", x.text), el("td", "", x.decided), el("td", "", x.note));
        });
      }
      var s = put(pane, section("Báo cáo"));
      if (!project.reports.length) { add(s, el("p", "muted", "Chưa có báo cáo nào.")); return; }
      var table = put(s, el("table"));
      add(table, headRow(["Thời gian", "Phiên", "Trạng thái", "Việc", "Cần bên khác"]));
      var body = put(table, el("tbody"));
      project.reports.forEach(function (rp) {
        var f = rp.fields;
        var state = (f["Trạng thái"] || "").toLowerCase();
        var cls = state.indexOf("xong") === 0 ? "ok-text" : (state.indexOf("bị chặn") === 0 ? "bad-text" : "");
        var details = add(el("details"), el("summary", "", f["Việc"] || rp.file), el("pre", "doc", rp.text));
        var need = f["Cần bên khác"] || "";
        add(body, row([rp.time, f["Phiên"] || "?", el("span", cls, f["Trạng thái"] || "?"), details,
          /^không\b/i.test(need) || !need ? el("span", "muted", need || "—") : el("span", "bad-text", need)]));
      });
    });
  }

  };

  // ---------------------------------------------------------------- game design: code vẽ nằm ở view/gamedesign.js
  var views = window.CORESIMPLE_VIEWS || {};
  if (views.gamedesign) {
    tab("game-design", "Game design", function (pane) {
      views.gamedesign(pane, { el: el, add: add, put: put, section: section, setup: window.CORESIMPLE_SETUP || null });
    }, ["gamedesign"]);
  }

  // ---------------------------------------------------------------- studio: art Simple và Detail, bản game đang dùng (view/studio.js)
  if (views.studio) {
    tab("studio", "Studio", function (pane) {
      views.studio(pane, { el: el, add: add, put: put, section: section, setup: window.CORESIMPLE_SETUP || null });
    }, ["art"]);
  }

  // ---------------------------------------------------------------- tham chiếu: ảnh người nạp, kèm nhận định (view/references.js)
  if (views.references) {
    tab("tham-chieu", "Tham chiếu", function (pane) {
      views.references(pane, { el: el, add: add, put: put, section: section, setup: window.CORESIMPLE_SETUP || null });
    }, ["references"]);
  }

  // ---------------------------------------------------------------- hộp thư: tin cho thread chạy theo việc (view/inbox.js)
  if (views.inbox) {
    tab("hop-thu", "Hộp thư", function (pane) {
      views.inbox(pane, { el: el, add: add, put: put, section: section, setup: window.CORESIMPLE_SETUP || null });
    });
  }

  // ---------------------------------------------------------------- bug: bug để sửa sau (view/bugs.js)
  if (views.bugs) {
    tab("bug", "Bug", function (pane) {
      views.bugs(pane, { el: el, add: add, put: put, section: section, setup: window.CORESIMPLE_SETUP || null });
    });
  }

  // ---------------------------------------------------------------- đang chạy: mọi agent đang chạy (view/activity.js)
  if (views.activity) {
    tab("dang-chay", "Đang chạy", function (pane) {
      views.activity(pane, { el: el, add: add, put: put, section: section, setup: window.CORESIMPLE_SETUP || null });
    });
  }

  // ---------------------------------------------------------------- tài liệu: khái niệm chung, ảnh nằm ở docs/
  tab("tai-lieu", "Tài liệu", function (pane) {
    add(pane, el("h1", "", "Tài liệu"));
    add(pane, el("p", "sub", "Khái niệm dùng chung cho thiết kế và code. Ảnh nằm ở Management/docs/."));
    var s = put(pane, section("Các rect của một nút (frame: outline, shadow, aura, cut)"));
    var link = put(s, el("a"));
    link.href = "docs/button-rects.png";
    link.target = "_blank";
    var img = put(link, el("img"));
    img.src = "docs/button-rects.png";
    img.alt = "Nút mẫu với các rect vẽ bằng màu khác nhau";
    img.style.cssText = "max-width:100%;height:auto;display:block;border-radius:6px;margin:4px 0 12px";
    var table = put(s, el("table"));
    add(table, headRow(["Rect", "Gồm", "Dùng để"]));
    var body = put(table, el("tbody"));
    [["Image", "cả ảnh, kể cả phần trong suốt", "không dùng để xếp"],
     ["Dùng", "ảnh sau khi trim alpha: mặt, viền, bóng, aura", "chỗ đặt ảnh; pivot ảnh = tâm cảm nhận trong rect này"],
     ["Vùng chạm", "mặt + viền (lệch dưới); không gồm bóng, aura", "nhận bấm; phần thừa ra ngoài mặt là raycast padding; cỡ bấm tối thiểu đo ở đây"],
     ["Cảm nhận", "mặt chính, không gồm viền, bóng (x y w h của frame)", "RectTransform; chữ căn giữa; bấm thì cả nhóm scale quanh tâm này"],
     ["An toàn max X", "rộng hết mặt, thụt trên dưới bằng chiều cao hoa văn góc", "chữ dài, thấp lọt rect này là đạt"],
     ["An toàn max Y", "cao hết mặt, thụt trái phải bằng chiều rộng hoa văn góc", "chữ hẹp, cao lọt rect này là đạt"],
     ["An toàn trong", "thụt cả hai chiều", "lọt rect này thì chữ nào cũng an toàn; chọn cỡ chữ mặc định"]
    ].forEach(function (r) { add(body, row(r)); });
    add(s, el("p", "gap muted", "Ba rect an toàn cùng tâm với rect cảm nhận. Tâm aura đặt theo mặt (ở ví dụ: giữa mép trên). " +
      "Cú pháp trong frame: outline=dày[,dx,dy] shadow=dx,dy,mờ[,alpha] aura=r[,top|center|bottom] cut=rộng,cao, " +
      "màu #rrggbb hoặc #a>#b (xem .claude/rules/uidesigner.md)."));
  });

  // ---------------------------------------------------------------- setup: tạo và gán đủ bộ thread
  // Chạy qua Management/tools/setup_server.py (127.0.0.1). Tên thread = giá trị FEATURE.
  tab("setup", "Setup", function (pane) {
    add(pane, el("h1", "", "Setup thread"));
    add(pane, el("p", "sub", "Mỗi thread là một chat Claude Code của project, tên đúng bằng giá trị FEATURE. " +
      "Thread trùng tên đã có thì chỉ gán; chưa có thì tạo mới với model và effort chọn bên dưới (tốn một câu trả lời ngắn). Thread đã archive bị bỏ qua."));

    if (!setupInfo) {
      var off = put(pane, section("Chạy server Setup"));
      add(off, el("p", "", "Trang đang mở thẳng từ file nên không tạo hay gán thread được. Chạy lệnh này ở gốc project (terminal VS Code), rồi mở link nó in ra:"));
      add(off, commandBlock("python Management/tools/setup_server.py"));
      add(off, el("p", "muted gap", "Server chỉ nghe ở 127.0.0.1. PIN chỉ đi từ trang này tới server, không qua chat, không được lưu."));
      return;
    }

    var api = function (method, path, body) {
      return fetch(path, {
        method: method,
        headers: { "Content-Type": "application/json", "X-Setup-Token": setupInfo.token },
        body: body ? JSON.stringify(body) : undefined,
        cache: "no-store"
      }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    };

    var form = put(pane, section("PIN"));
    var pinRow = put(form, el("div", "cmd"));
    var pin = put(pinRow, el("input"));
    pin.type = "password";
    pin.autocomplete = "new-password";
    pin.placeholder = "PIN (chỉ giữ trong ô này, không lưu)";
    pin.setAttribute("aria-label", "PIN");

      pane.textContent = "";
      add(pane, el("p", "bad-text", "Không tải được dữ liệu của tab này: " + e.message));
      var again = put(pane, el("button", "", "Thử lại"));
      again.type = "button";
      again.addEventListener("click", function () { fill(t); });
    });
  };
  var show = function (stay) {
    var key = decodeURIComponent(location.hash.slice(1));
    var t = tabs.filter(function (x) { return x.key === key; })[0] || tabs[0];
    tabs.forEach(function (x) {
      links[x.key].removeAttribute("aria-current");
      if (built[x.key]) built[x.key].hidden = true;
    });
    links[t.key].setAttribute("aria-current", "page");
    if (!built[t.key]) built[t.key] = put(panes, el("div"));
    if (!t.state) fill(t);
    built[t.key].hidden = false;
    document.title = t.label + " — CoreSimple";
    if (stay !== true) window.scrollTo(0, 0);
  };

  var notice = function (text) {
    notices.push(text);
    $("notice").textContent = notices.join(" ");
    $("notice").hidden = false;
  };
  // Project nạp nền: trang hiện ngay, tab Báo cáo thêm vào thanh khi dữ liệu về.
  var gotProject = function (data) {
    project = data;
    if (!project) { notice("Chưa có data/project.js. Chạy: python Management/tools/sync_page.py (Stop hook tự chạy sau mỗi lượt chat)."); return; }
    adding = [];
    projectTabs();
    tabs.splice.apply(tabs, [1, 0].concat(adding));
    adding = tabs;
    renderNav();
    show(true);      // thanh tab vừa dựng lại; trang mở thẳng vào một tab vừa thêm (ví dụ #bao-cao) thì mở tab đó
  };
  load("project").then(null, function (e) { notice("Không tải được dữ liệu project: " + e.message); });

  renderNav();
  window.addEventListener("hashchange", show);
  show();

  if (!idea) notice("Không đọc được data/idea.js.");
  $("footer").textContent = idea && idea.approvedAt ? "Ý tưởng duyệt ngày " + idea.approvedAt : "Ý tưởng chưa được duyệt.";
})();
</script>
</body>
</html>

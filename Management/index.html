<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreSimple — Quản lý</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1c1a; --muted: #6b6860;
    --line: #dedbd2; --accent: #2f6f5e; --warn-bg: #fbf1d8; --warn-text: #6b4e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --text: #ecebe6; --muted: #9c998f;
      --line: #33322d; --accent: #7fc4ae; --warn-bg: #3a2f10; --warn-text: #f0d68a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 32px; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 4px 0 0; font-size: 30px; line-height: 1.25; text-wrap: balance; }
  h2 { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; margin-bottom: 16px; }
  p { margin: 0; }
  ul { margin: 0; padding-left: 20px; }
  li + li { margin-top: 6px; }
  .muted { color: var(--muted); }
  .notice { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  footer { margin-top: 24px; font-size: 13px; color: var(--muted); }
  code { font-family: Consolas, monospace; font-size: .92em; }
  [hidden] { display: none; }
  h3 { margin: 0; font-size: 16px; }
  .session { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
  .session .muted { font-size: 14px; }
  .cmd { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; }
  .cmd pre {
    flex: 1; min-width: 0; margin: 0; padding: 10px 12px; overflow-x: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    font: 14px/1.5 Consolas, monospace; white-space: pre;
  }
  .cmd.tall { flex-direction: column; }
  .cmd.tall pre { white-space: pre-wrap; }
  .cmd.tall button { align-self: flex-start; }
  button.copy {
    flex: none; padding: 8px 14px; border: 1px solid var(--accent); border-radius: 6px;
    background: transparent; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer;
  }
  button.copy:hover { background: var(--accent); color: var(--panel); }
  button.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .gap { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">CoreSimple · Trang quản lý</div>
    <h1 id="title"></h1>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section>
    <h2>Ý tưởng cốt lõi</h2>
    <p id="summary"></p>
  </section>

  <section id="pillars-box" hidden>
    <h2>Trụ cột thiết kế</h2>
    <ul id="pillars"></ul>
  </section>

  <section>
    <h2>Feature</h2>
    <p class="muted">Chưa có số liệu. Danh sách và tình trạng feature sẽ lấy từ script đo, không do AI khai.</p>
  </section>

  <section id="sessions-box" hidden>
    <h2>Gán chat theo feature</h2>
    <p id="sessions-intro"></p>
    <div id="pin-box" class="session" hidden>
      <h3 id="pin-title"></h3>
      <p id="pin-hint" class="muted"></p>
    </div>
    <div id="sessions"></div>
    <ul id="sessions-notes" class="gap muted"></ul>
  </section>

  <section id="brief-box" hidden>
    <h2 id="brief-title"></h2>
    <p id="brief-hint" class="muted"></p>
    <div id="brief"></div>
  </section>

  <footer id="footer"></footer>
</main>

<!-- Trang này chỉ là vỏ. Mọi nội dung nằm trong data/. -->
<script src="data/idea.js"></script>
<script src="data/sessions.js"></script>
<script>
  (function () {
    var idea = window.CORESIMPLE_IDEA;
    var $ = function (id) { return document.getElementById(id); };
    var notice = function (text) { $("notice").textContent = text; $("notice").hidden = false; };

    if (!idea) {
      $("title").textContent = "Chưa nạp được dữ liệu";
      $("summary").textContent = "—";
      notice("Không đọc được data/idea.js. Kiểm tra file có tồn tại và có gán window.CORESIMPLE_IDEA.");
      return;
    }

    $("title").textContent = idea.title || "Chưa đặt tên game";
    if (idea.summary) {
      $("summary").textContent = idea.summary;
    } else {
      $("summary").textContent = "Chưa có ý tưởng được duyệt.";
      $("summary").className = "muted";
      notice("data/idea.js đang trống. Người duyệt điền ý tưởng vào file đó; AI chỉ được đề xuất trong proposals/.");
    }

    var pillars = Array.isArray(idea.pillars) ? idea.pillars : [];
    pillars.forEach(function (text) {
      var li = document.createElement("li");
      li.textContent = text;
      $("pillars").appendChild(li);
    });
    $("pillars-box").hidden = pillars.length === 0;

    $("footer").textContent = idea.approvedAt ? "Ý tưởng duyệt ngày " + idea.approvedAt : "Ý tưởng chưa được duyệt.";
  })();

  (function () {
    var data = window.CORESIMPLE_SESSIONS;
    if (!data) return;
    var $ = function (id) { return document.getElementById(id); };
    var el = function (tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    };

    var copyText = function (text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      // Trang mở từ file:// có thể không có Clipboard API: chép qua một ô nhập tạm.
      return new Promise(function (resolve, reject) {
        var box = el("textarea");
        box.value = text;
        box.style.position = "fixed";
        box.style.opacity = "0";
        document.body.appendChild(box);
        box.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        document.body.removeChild(box);
        if (ok) resolve(); else reject(new Error("copy failed"));
      });
    };

    // `copy` là chữ được chép, mặc định giống chữ hiển thị.
    var commandBlock = function (text, tall, copy) {
      var wrap = el("div", tall ? "cmd tall" : "cmd");
      var pre = el("pre", "", text);
      var button = el("button", "copy", "Chép");
      button.type = "button";
      button.addEventListener("click", function () {
        copyText(copy === undefined ? text : copy).then(
          function () { button.textContent = "Đã chép"; },
          function () { button.textContent = "Không chép được, hãy bôi đen và Ctrl+C"; }
        ).then(function () {
          setTimeout(function () { button.textContent = "Chép"; }, 2000);
        });
      });
      wrap.appendChild(pre);
      wrap.appendChild(button);
      return wrap;
    };

    var features = Array.isArray(data.features) ? data.features : [];
    if (features.length) {
      $("sessions-intro").textContent = data.intro || "";
      if (data.pinCommand) {
        $("pin-title").textContent = data.pinTitle || "Đặt PIN";
        $("pin-hint").textContent = data.pinHint || "";
        $("pin-box").appendChild(commandBlock(data.pinCommand));
        $("pin-box").hidden = false;
      }
      features.forEach(function (feature) {
        var box = el("div", "session");
        box.appendChild(el("h3", "", feature.label || feature.id));
        if (feature.note) box.appendChild(el("p", "muted", feature.note));
        // Chỉ chép phần trước PIN: PIN do người tự gõ, không nằm trong trang.
        var bind = "FEATURE=" + feature.id + " ";
        box.appendChild(commandBlock(bind + "<PIN>", false, feature.copy || bind));
        $("sessions").appendChild(box);
      });
      (Array.isArray(data.notes) ? data.notes : []).forEach(function (text) {
        $("sessions-notes").appendChild(el("li", "", text));
      });
      $("sessions-box").hidden = false;
    }

    if (data.brief) {
      $("brief-title").textContent = data.briefTitle || "Mẫu lệnh giao việc";
      $("brief-hint").textContent = data.briefHint || "";
      $("brief").appendChild(commandBlock(data.brief, true));
      $("brief-box").hidden = false;
    }
  })();
</script>
</body>
</html>

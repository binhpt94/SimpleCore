e="middle">Kỉ lục: 16 đợt · 700x70</text></g><g class="fr-shape" data-id="new-record" data-shape="label" data-x="760" data-y="530" data-w="400" data-h="70"><title>new-record (label) Kỉ lục mới!: x=760 y=530 w=400 h=70</title><rect class="fr-label" x="760" y="530" width="400" height="70"/><text class="fr-text" x="960" y="565" font-size="34" text-anchor="middle" dominant-baseline="middle">Kỉ lục mới! · 400x70</text></g><g class="fr-shape" data-id="replay" data-shape="button" data-x="610" data-y="730" data-w="400" data-h="120"><title>replay (button) Chơi lại (nút chính): x=610 y=730 w=400 h=120</title><rect class="fr-button" x="610" y="730" width="400" height="120" rx="14.4"/><text class="fr-text" x="810" y="790" font-size="34" text-anchor="middle" dominant-baseline="middle">Chơi lại (nút chính) · 400x120</text></g><g class="fr-shape" data-id="home" data-shape="button" data-x="1050" data-y="730" data-w="260" data-h="120"><title>home (button) Về màn bắt đầu: x=1050 y=730 w=260 h=120</title><rect class="fr-button" x="1050" y="730" width="260" height="120" rx="14.4"/><text class="fr-text" x="1180" y="790" font-size="34" text-anchor="middle" dominant-baseline="middle">Về màn bắt đầu · 260x120</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ===== Tran dung yen phia sau (world-cartoon) ===== -->
  <g id="battle" stroke="#1B1B24" stroke-linejoin="round">
    <rect x="0" y="0" width="1920" height="780" fill="#86CBE6" stroke="none"/>
    <!-- doi xa -->
    <path d="M0 700 Q240 560 480 690 Q720 590 960 690 Q1200 580 1440 690 Q1680 570 1920 690 L1920 780 L0 780 Z" fill="#6FAE6A" stroke-width="4"/>
    <!-- mat dat -->
    <rect x="-4" y="780" width="1928" height="304" fill="#8E6440" stroke-width="4"/>
    <rect x="-4" y="770" width="1928" height="28" fill="#6DBE45" stroke-width="4"/>
    <!-- thanh o giua, chinh dien, doi xung -->
    <g id="castle" stroke-width="5">
      <rect x="820" y="470" width="280" height="310" fill="#BDB4A2"/>
      <rect x="800" y="400" width="80" height="380" fill="#A59C8A"/>
      <rect x="1040" y="400" width="80" height="380" fill="#A59C8A"/>
      <path d="M790 400 L840 330 L890 400 Z" fill="#C94A3D"/>
      <path d="M1030 400 L1080 330 L1130 400 Z" fill="#C94A3D"/>
      <rect x="820" y="450" width="30" height="24" fill="#BDB4A2"/>
      <rect x="870" y="450" width="30" height="24" fill="#BDB4A2"/>
      <rect x="1020" y="450" width="30" height="24" fill="#BDB4A2"/>
      <rect x="1070" y="450" width="30" height="24" fill="#BDB4A2"/>
      <path d="M910 780 L910 660 Q960 610 1010 660 L1010 780 Z" fill="#5A3A22"/>
      <rect x="828" y="520" width="24" height="44" fill="#2E2E3A"/>
      <rect x="1068" y="520" width="24" height="44" fill="#2E2E3A"/>
      <line x1="960" y1="470" x2="960" y2="380" stroke-width="5"/>
      <path d="M960 384 L1010 400 L960 416 Z" fill="#E8C33A"/>
    </g>
    <!-- hero tong am, quay ra hai phia -->
    <g id="hero-left" stroke-width="4">
      <ellipse cx="700" cy="784" rx="34" ry="8" fill="#3A2A1C" stroke="none"/>
      <rect x="680" y="720" width="40" height="60" rx="10" fill="#E2873A"/>
      <circle cx="700" cy="696" r="30" fill="#F4C9A0"/>
      <path d="M672 690 Q700 650 728 690 Z" fill="#D8B13A"/>
      <rect x="652" y="724" width="26" height="40" rx="6" fill="#D8B13A"/>
    </g>
    <g id="hero-right" stroke-width="4">
      <ellipse cx="1220" cy="784" rx="34" ry="8" fill="#3A2A1C" stroke="none"/>
      <rect x="1200" y="720" width="40" height="60" rx="10" fill="#F0B23C"/>
      <circle cx="1220" cy="696" r="30" fill="#F4C9A0"/>
      <path d="M1190 692 Q1220 652 1250 692 Z" fill="#3E8E4A"/>
      <path d="M1252 700 Q1282 740 1252 780" fill="none" stroke-width="6"/>
    </g>
    <!-- quai tong lanh, tu hai ben -->
    <g id="enemies" stroke-width="4">
      <ellipse cx="180" cy="784" rx="40" ry="9" fill="#3A2A1C" stroke="none"/>
      <path d="M140 780 Q140 700 180 690 Q220 700 220 780 Z" fill="#5B5FC7"/>
      <circle cx="168" cy="726" r="7" fill="#FFFFFF"/>
      <circle cx="194" cy="726" r="7" fill="#FFFFFF"/>
      <ellipse cx="360" cy="784" rx="46" ry="10" fill="#3A2A1C" stroke="none"/>
      <path d="M314 780 Q312 680 360 668 Q408 680 406 780 Z" fill="#7A4FB5"/>
      <path d="M330 676 L338 646 L352 670 Z" fill="#7A4FB5"/>
      <path d="M390 676 L382 646 L368 670 Z" fill="#7A4FB5"/>
      <circle cx="346" cy="712" r="7" fill="#FFFFFF"/>
      <circle cx="374" cy="712" r="7" fill="#FFFFFF"/>
      <ellipse cx="520" cy="784" rx="34" ry="8" fill="#3A2A1C" stroke="none"/>
      <path d="M488 780 Q488 716 520 708 Q552 716 552 780 Z" fill="#3F7FA8"/>
      <circle cx="512" cy="738" r="6" fill="#FFFFFF"/>
      <ellipse cx="1420" cy="784" rx="34" ry="8" fill="#3A2A1C" stroke="none"/>
      <path d="M1388 780 Q1388 716 1420 708 Q1452 716 1452 780 Z" fill="#3F7FA8"/>
      <circle cx="1428" cy="738" r="6" fill="#FFFFFF"/>
      <ellipse cx="1580" cy="784" rx="46" ry="10" fill="#3A2A1C" stroke="none"/>
      <path d="M1534 780 Q1532 680 1580 668 Q1628 680 1626 780 Z" fill="#7A4FB5"/>
      <path d="M1550 676 L1558 646 L1572 670 Z" fill="#7A4FB5"/>
      <path d="M1610 676 L1602 646 L1588 670 Z" fill="#7A4FB5"/>
      <circle cx="1566" cy="712" r="7" fill="#FFFFFF"/>
      <circle cx="1594" cy="712" r="7" fill="#FFFFFF"/>
      <ellipse cx="1750" cy="784" rx="40" ry="9" fill="#3A2A1C" stroke="none"/>
      <path d="M1710 780 Q1710 700 1750 690 Q1790 700 1790 780 Z" fill="#5B5FC7"/>
      <circle cx="1738" cy="726" r="7" fill="#FFFFFF"/>
      <circle cx="1764" cy="726" r="7" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== Nen che: mot lop phang toi rieng, phu toan man ===== -->
  <rect id="backdrop" x="0" y="0" width="1920" height="1080" fill="#000000" fill-opacity="0.62"/>

  <!-- ===== Popup thua (ui-flat) ===== -->
  <!-- 6 mau chinh: #2B3A67 khung, #1C2747 o chu, #E04A4A tieu de, #FFC633 ki luc moi, #3DCB6E nut chinh, #5E6A86 nut phu; cong trang, den -->
  <g id="popup">
    <!-- bong do cung -->
    <rect x="560" y="197" width="800" height="700" rx="36" fill="#000000"/>
    <rect id="panel" x="560" y="190" width="800" height="700" rx="36" fill="#2B3A67" stroke="#000000" stroke-width="6"/>
    <!-- vung tieu de -->
    <rect id="title" x="610" y="230" width="700" height="90" rx="20" fill="#E04A4A" stroke="#000000" stroke-width="5"/>
    <!-- dong diem, dong ki luc: o chu trong -->
    <rect id="score" x="610" y="350" width="700" height="70" rx="16" fill="#1C2747" stroke="#000000" stroke-width="4"/>
    <rect id="record" x="610" y="440" width="700" height="70" rx="16" fill="#1C2747" stroke="#000000" stroke-width="4"/>
    <!-- Ki luc moi: dai huy hieu noi bat -->
    <path d="M712 541 L760 541 L760 607 L712 607 L732 574 Z" fill="#E04A4A" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <path d="M1208 541 L1160 541 L1160 607 L1208 607 L1188 574 Z" fill="#E04A4A" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <rect x="760" y="536" width="400" height="70" rx="20" fill="#000000"/>
    <rect id="new-record" x="760" y="530" width="400" height="70" rx="20" fill="#FFC633" stroke="#000000" stroke-width="5"/>
    <path d="M800 547 L806 560 L820 561 L809 570 L813 584 L800 576 L787 584 L791 570 L780 561 L794 560 Z" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1120 547 L1126 560 L1140 561 L1129 570 L1133 584 L1120 576 L1107 584 L1111 570 L1100 561 L1114 560 Z" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- nut chinh Choi lai: sang, noi hon -->
    <rect x="610" y="738" width="400" height="120" rx="28" fill="#000000"/>
    <rect id="replay" x="610" y="730" width="400" height="120" rx="28" fill="#3DCB6E" stroke="#000000" stroke-width="6"/>
    <!-- nut phu Ve man bat dau: toi hon -->
    <rect x="1050" y="736" width="260" height="120" rx="28" fill="#000000"/>
    <rect id="home" x="1050" y="730" width="260" height="120" rx="28" fill="#5E6A86" stroke="#000000" stroke-width="4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE780"/>
      <stop offset="0.4" stop-color="#FFC61F"/>
      <stop offset="1" stop-color="#F29A0E"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C77BEA"/>
      <stop offset="0.5" stop-color="#9B30C8"/>
      <stop offset="1" stop-color="#6E1E99"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CD0FF"/>
      <stop offset="0.45" stop-color="#22A0F0"/>
      <stop offset="1" stop-color="#1270C8"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9ACB"/>
      <stop offset="0.5" stop-color="#F24FA0"/>
      <stop offset="1" stop-color="#C42A78"/>
    </linearGradient>
  </defs>

  <!-- keep: rounded merlons then body -->
  <g fill="url(#wall)" stroke="#C26A00" stroke-width="8" stroke-linejoin="round">
    <rect x="82" y="140" width="28" height="36" rx="9"/>
    <rect x="118" y="140" width="28" height="36" rx="9"/>
    <rect x="154" y="140" width="28" height="36" rx="9"/>
    <rect x="190" y="140" width="28" height="36" rx="9"/>
    <rect x="76" y="164" width="148" height="232" rx="6"/>
  </g>
  <rect x="92" y="178" width="116" height="9" rx="4.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- keep window -->
  <path d="M136 226 L136 204 Q136 188 150 188 Q164 188 164 204 L164 226 Z" fill="#4A1070" stroke="#C26A00" stroke-width="5" stroke-linejoin="round"/>
  <rect x="142" y="196" width="6" height="12" rx="3" fill="#C77BEA"/>

  <!-- emblem shield -->
  <path d="M134 238 H166 V254 Q166 268 150 274 Q134 268 134 254 Z" fill="url(#pink)" stroke="#8E1556" stroke-width="4" stroke-linejoin="round"/>
  <rect x="140" y="243" width="12" height="5" rx="2.5" fill="#FFFFFF" opacity="0.7"/>

  <!-- gate -->
  <path d="M116 396 L116 320 Q116 286 150 286 Q184 286 184 320 L184 396 Z" fill="url(#gate)" stroke="#0B4C94" stroke-width="8" stroke-linejoin="round"/>
  <path d="M150 292 V392" stroke="#0B4C94" stroke-width="4" stroke-linecap="round"/>
  <path d="M126 312 Q132 298 144 296" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <g fill="#FFC61F" stroke="#C26A00" stroke-width="3">
    <circle cx="140" cy="348" r="5"/>
    <circle cx="160" cy="348" r="5"/>
  </g>

  <!-- towers: solid walls, plain at hero height -->
  <g fill="url(#wall)" stroke="#C26A00" stroke-width="8" stroke-linejoin="round">
    <rect x="7" y="116" width="86" height="280" rx="6"/>
    <rect x="207" y="116" width="86" height="280" rx="6"/>
  </g>
  <g fill="#FFFFFF" opacity="0.6">
    <rect x="18" y="140" width="64" height="9" rx="4.5"/>
    <rect x="218" y="140" width="64" height="9" rx="4.5"/>
  </g>

  <!-- tower windows -->
  <g fill="#4A1070" stroke="#C26A00" stroke-width="5">
    <rect x="38" y="164" width="24" height="40" rx="12"/>
    <rect x="238" y="164" width="24" height="40" rx="12"/>
  </g>
  <g fill="#C77BEA">
    <rect x="44" y="172" width="6" height="12" rx="3"/>
    <rect x="244" y="172" width="6" height="12" rx="3"/>
  </g>

  <!-- flag poles -->
  <g stroke="#4A1070" stroke-width="5" stroke-linecap="round">
    <path d="M50 8 V40"/>
    <path d="M250 8 V40"/>
  </g>
  <!-- flags (mirrored) -->
  <g fill="url(#pink)" stroke="#8E1556" stroke-width="4" stroke-linejoin="round">
    <path d="M48 9 Q35 5 20 12 Q30 18 22 27 Q36 23 48 27 Z"/>
    <path d="M252 9 Q265 5 280 12 Q270 18 278 27 Q264 23 252 27 Z"/>
  </g>

  <!-- cone roofs -->
  <g fill="url(#roof)" stroke="#4A1070" stroke-width="8" stroke-linejoin="round">
    <path d="M2 126 Q16 92 50 34 Q84 92 98 126 Q50 140 2 126 Z"/>
    <path d="M202 126 Q216 92 250 34 Q284 92 298 126 Q250 140 202 126 Z"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <path d="M42 54 Q32 72 24 92"/>
    <path d="M258 54 Q268 72 276 92"/>
  </g>
</svg>

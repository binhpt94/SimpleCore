    <g stroke="#000000" stroke-width="13">
      <line x1="0" y1="-30" x2="0" y2="30"/>
      <line x1="-26" y1="-15" x2="26" y2="15"/>
      <line x1="-26" y1="15" x2="26" y2="-15"/>
    </g>
    <g stroke="#8ED6FF" stroke-width="6">
      <line x1="0" y1="-30" x2="0" y2="30"/>
      <line x1="-26" y1="-15" x2="26" y2="15"/>
      <line x1="-26" y1="15" x2="26" y2="-15"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#8ED6FF" stroke="#000000" stroke-width="4"/>
  </g>
</svg>

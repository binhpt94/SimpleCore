<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE780"/>
      <stop offset="0.12" stop-color="#FFC61F"/>
      <stop offset="0.88" stop-color="#FFC61F"/>
      <stop offset="1" stop-color="#F29A0E"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.1" stop-color="#FFF1E4"/>
      <stop offset="0.9" stop-color="#FFF1E4"/>
      <stop offset="1" stop-color="#F6D7C6"/>
    </linearGradient>
  </defs>
  <!-- bong do lech xuong 8 px, nam trong vien duoi 56 cua 9-slice -->
  <rect x="0" y="8" width="800" height="692" rx="40" fill="#3B1E4F" fill-opacity="0.35"/>
  <!-- vien ngoai dam (cot Vien cua vang) 4 px -->
  <rect x="0" y="0" width="800" height="692" rx="40" fill="#C26A00"/>
  <!-- vien vang day 12 px, gradient doc sang tren toi duoi -->
  <rect x="4" y="4" width="792" height="684" rx="36" fill="url(#gold)"/>
  <!-- vet bong sang mep tren cua vien vang -->
  <rect x="44" y="7" width="712" height="5" rx="2.5" fill="#FFF6C8" fill-opacity="0.9"/>
  <!-- go trong cua vien vang (bong vang) 4 px -->
  <rect x="16" y="16" width="768" height="660" rx="26" fill="#F29A0E"/>
  <!-- than popup kem -->
  <rect x="20" y="20" width="760" height="652" rx="22" fill="url(#cream)"/>
  <!-- vet bong sang mep tren cua than -->
  <rect x="44" y="27" width="712" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>

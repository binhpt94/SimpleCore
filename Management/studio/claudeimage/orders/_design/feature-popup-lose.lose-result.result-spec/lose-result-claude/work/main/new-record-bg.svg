<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 70" width="400" height="70">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE780"/>
      <stop offset="0.45" stop-color="#FFC61F"/>
      <stop offset="1" stop-color="#F29A0E"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9ACB"/>
      <stop offset="0.4" stop-color="#F24FA0"/>
      <stop offset="1" stop-color="#C42A78"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE780"/>
      <stop offset="1" stop-color="#FFC61F"/>
    </linearGradient>
  </defs>
  <!-- duoi ruy bang hong hai ben, vien hong dam 4 px -->
  <path d="M4 16 L58 16 L58 62 L4 62 L18 39 Z" fill="url(#pink)" stroke="#8E1556" stroke-width="4" stroke-linejoin="round"/>
  <path d="M396 16 L342 16 L342 62 L396 62 L382 39 Z" fill="url(#pink)" stroke="#8E1556" stroke-width="4" stroke-linejoin="round"/>
  <!-- bong do cua dai, lech xuong 6 px -->
  <rect x="34" y="10" width="332" height="56" rx="28" fill="#3B1E4F" fill-opacity="0.35"/>
  <!-- dai vang phong nhu keo, vien vang dam 5 px -->
  <rect x="34" y="4" width="332" height="56" rx="28" fill="url(#gold)" stroke="#C26A00" stroke-width="5"/>
  <!-- vet bong sang mep tren -->
  <rect x="62" y="10" width="276" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.55"/>
  <!-- hai ngoi sao vang o hai dau dai (chi o mep, khong de chu) -->
  <path d="M40 15 L44.7 25.5 L56.2 26.8 L47.6 34.5 L50 45.8 L40 40 L30 45.8 L32.4 34.5 L23.8 26.8 L35.3 25.5 Z" fill="url(#star)" stroke="#C26A00" stroke-width="4" stroke-linejoin="round"/>
  <path d="M360 15 L364.7 25.5 L376.2 26.8 L367.6 34.5 L370 45.8 L360 40 L350 45.8 L352.4 34.5 L343.8 26.8 L355.3 25.5 Z" fill="url(#star)" stroke="#C26A00" stroke-width="4" stroke-linejoin="round"/>
</svg>

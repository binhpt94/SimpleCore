<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="kBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CD0FF"/><stop offset="0.45" stop-color="#22A0F0"/><stop offset="1" stop-color="#1270C8"/>
    </linearGradient>
    <linearGradient id="kGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE780"/><stop offset="0.45" stop-color="#FFC61F"/><stop offset="1" stop-color="#F29A0E"/>
    </linearGradient>
    <linearGradient id="kRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A80"/><stop offset="0.5" stop-color="#F0383C"/><stop offset="1" stop-color="#B81E28"/>
    </linearGradient>
    <linearGradient id="kSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.4" stop-color="#FFF1E4"/><stop offset="1" stop-color="#F6D7C6"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- chùm lông đỏ trên mũ -->
    <path d="M66 50 C52 14 92 -2 128 12 C108 18 98 30 104 46 Z" fill="url(#kRed)" stroke="#7E1018" stroke-width="6"/>
    <!-- chân -->
    <rect x="58" y="246" width="32" height="48" rx="10" fill="url(#kBlue)" stroke="#0B4C94" stroke-width="6"/>
    <rect x="104" y="246" width="32" height="48" rx="10" fill="url(#kBlue)" stroke="#0B4C94" stroke-width="6"/>
    <!-- thân giáp xanh dương -->
    <rect x="50" y="156" width="96" height="100" rx="26" fill="url(#kBlue)" stroke="#0B4C94" stroke-width="6"/>
    <ellipse cx="80" cy="172" rx="20" ry="7" fill="#FFFFFF" opacity="0.55"/>
    <rect x="52" y="206" width="92" height="14" fill="url(#kGold)" stroke="#C26A00" stroke-width="4"/>
    <!-- đầu: mũ giáp tròn -->
    <circle cx="96" cy="100" r="60" fill="url(#kBlue)" stroke="#0B4C94" stroke-width="6"/>
    <ellipse cx="74" cy="64" rx="22" ry="11" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 74 64)"/>
    <!-- khe mặt -->
    <rect x="92" y="84" width="58" height="46" rx="18" fill="url(#kSkin)" stroke="#E0A27A" stroke-width="4"/>
    <ellipse cx="130" cy="104" rx="10" ry="12" fill="#FFFFFF" stroke="#3B1E4F" stroke-width="3"/>
    <circle cx="133" cy="106" r="6" fill="#3B1E4F"/>
    <circle cx="135" cy="103" r="2.5" fill="#FFFFFF"/>
    <path d="M112 120 Q122 126 132 120" fill="none" stroke="#3B1E4F" stroke-width="4"/>
    <!-- khiên lớn vàng phía trước -->
    <path d="M122 158 L196 158 L196 212 C196 246 172 266 159 276 C146 266 122 246 122 212 Z" fill="url(#kGold)" stroke="#C26A00" stroke-width="6"/>
    <path d="M159 172 L159 256 M134 200 L184 200" fill="none" stroke="#F0383C" stroke-width="12"/>
    <path d="M159 172 L159 256 M134 200 L184 200" fill="none" stroke="#FF8A80" stroke-width="4" opacity="0.7"/>
    <ellipse cx="140" cy="170" rx="12" ry="5" fill="#FFFFFF" opacity="0.65"/>
  </g>
</svg>
